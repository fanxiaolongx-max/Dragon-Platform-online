name: Package AiOps-Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiops-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application and packaging contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build application packages
        run: python scripts/build_release.py
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: AiOps-Report-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/aiops-ui-tools --no-save --package-lock=false playwright@1.62.1
          /tmp/aiops-ui-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check JavaScript syntax and UI behavior
        env:
          NODE_PATH: /tmp/aiops-ui-tools/node_modules
        run: |
          node --check static/shared/dragon-claw.js
          node --check static/shared/developer-mode.js
          node tests/ui-browser.cjs

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [package, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AiOps-Report-${{ github.sha }}
          path: dist
      - name: Publish downloadable Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(jq -r .tag dist/release.json)
          version=$(jq -r .version dist/release.json)
          base_pkg=$(jq -r '.basePackage // ("AiOps-Report-v" + .version + "-base.zip")' dist/release.json)
          platform_pkg=$(jq -r '.platformPackage // ("AiOps-Report-v" + .version + "-platform.zip")' dist/release.json)
          cat > notes.md <<EOF
          自动构建：AiOps-Report ${version}
          源码提交：${SOURCE_COMMIT}

          - **${base_pkg}**：数字人基座部署包，根目录含 run.py、requirements.txt、app/、static/ 与初始化 SQL。
          - **${platform_pkg}**：Dragon Platform 导入包，额外含 platform-app.json，入口 app.main:create_app，健康检查 /health。在首页「导入 HTML / ZIP / SKILL」选择此文件。
          - **SHA256SUMS**：ZIP 的 SHA-256 校验值；release.json 记录源码提交及版本。

          数据库部署：基座由 DBA 手动执行 db/init.sql / db/upgrade.sql；平台包启用严格基座契约，须先更新宿主平台，再由管理员从运维菜单预览并部署 SQLite 脚本。启动和业务请求不会自动补表。

          两个包都不含 .env、业务数据库、日志、虚拟环境或 wheels。新环境需安装 Python，并能通过网络或内网 pip 镜像安装 requirements.txt；隔离网络需另行准备匹配目标系统与 Python 版本的离线依赖。
          包只迁移应用代码与初始化 SQL；基座连接、模型配置和已有业务数据需在目标环境单独配置或迁移。基座包保留 MySQL 初始化 SQL，平台使用 SQLite 初始化 SQL；真实内网基座仍需部署验证。
          EOF
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2> lookup.err; then
            if [ "$(cat draft.txt)" = false ]; then
              echo "Release $tag is already published; preserving its assets."
              exit 0
            fi
          else
            if ! grep -qi 'release not found\|HTTP 404' lookup.err; then
              cat lookup.err >&2
              exit 1
            fi
            gh release create "$tag" --target "$SOURCE_COMMIT" --draft \
              --title "AiOps-Report ${version} · ${SOURCE_COMMIT:0:12}" --notes-file notes.md
          fi
          gh release upload "$tag" "dist/${base_pkg}" "dist/${platform_pkg}" \
            dist/SHA256SUMS dist/release.json --clobber
          gh release edit "$tag" --draft=false --latest --notes-file notes.md
